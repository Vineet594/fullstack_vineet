# ======================
# Server
# ======================
server.port=8080

# ======================
# Database (H2 in-memory for local/dev)
# ======================
spring.datasource.url=jdbc:h2:mem:securecms;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ======================
# JWT Configuration
# ======================
# IMPORTANT: Change these values in production. Use long random strings.
jwt.secret=${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForHS256AlgorithmSecurity}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# ======================
# AES Encryption
# ======================
# 32-byte (256-bit) key recommended. Never hardcode in real projects.
aes.secret-key=${AES_SECRET_KEY:12345678901234567890123456789012}

# ======================
# Caching (Caffeine)
# ======================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# ======================
# Logging
# ======================
logging.level.root=INFO
logging.level.com.securecms=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - correlationId=%X{correlationId} - %msg%n

# ======================
# OpenAPI / Swagger
# ======================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ======================
# Pagination defaults
# ======================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
